<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs>
<linearGradient id="lbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1D2A57"/><stop offset="1" stop-color="#0A1124"/></linearGradient>
<linearGradient id="lgold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8DC9C"/><stop offset=".6" stop-color="#E9B85C"/><stop offset="1" stop-color="#C38E35"/></linearGradient>
<linearGradient id="lcone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6D48A" stop-opacity=".55"/><stop offset=".7" stop-color="#F6D48A" stop-opacity=".12"/><stop offset="1" stop-color="#F6D48A" stop-opacity="0"/></linearGradient>
<radialGradient id="lpool" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#F6D48A" stop-opacity=".55"/><stop offset="1" stop-color="#F6D48A" stop-opacity="0"/></radialGradient>
<radialGradient id="lbulbglow" cx="50%" cy="40%" r="50%"><stop offset="0" stop-color="#FFF3D0" stop-opacity=".9"/><stop offset="1" stop-color="#FFF3D0" stop-opacity="0"/></radialGradient>
<filter id="lsh" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".45"/></filter>
</defs><rect width="512" height="512" rx="112" fill="url(#lbg)"/>
<g transform="translate(256 256) scale(1.0) translate(-256 -256)">
  <!-- light cone and the pool it makes on the desk -->
  <path d="M206 262 H306 L402 446 H110 Z" fill="url(#lcone)"/>
  <ellipse cx="256" cy="440" rx="138" ry="18" fill="url(#lpool)"/>
  <!-- cord + cap -->
  <rect x="251" y="20" width="10" height="118" rx="5" fill="#B98A3A"/>
  <path d="M234 150 a22 14 0 0 1 44 0 v8 h-44 z" fill="url(#lgold)"/>
  <!-- shade -->
  <path d="M140 262 C140 196 192 152 256 152 C320 152 372 196 372 262 Z" fill="url(#lgold)" filter="url(#lsh)"/>
  <path d="M170 236 C182 198 214 176 252 172" fill="none" stroke="#FFF1CC" stroke-opacity=".55" stroke-width="9" stroke-linecap="round"/>
  <!-- rim -->
  <rect x="132" y="254" width="248" height="16" rx="8" fill="#B9832C"/>
  <!-- bulb -->
  <circle cx="256" cy="276" r="40" fill="url(#lbulbglow)"/>
  <path d="M228 270 a28 28 0 0 0 56 0 Z" fill="#FFF6DE"/>
</g></svg>